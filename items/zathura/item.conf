#!/usr/bin/env bash

ZATHURA_CONF_DIR="${CONFIG_DIR:-$HOME/.config}/zathura"

function check_dep() {
  command -v zathura >/dev/null 2>&1 || return 1
  zathura --version 2>/dev/null | grep -q 'pdf-mupdf'
}

function install_dep() {
  local packages=(zathura zathura-pdf-mupdf)

  echo "Required dependencies: zathura zathura-pdf-mupdf"

  if command -v paru >/dev/null 2>&1; then
    run paru -S --needed --noconfirm "${packages[@]}" || return 1
  elif command -v pacman >/dev/null 2>&1; then
    run sudo pacman -S --needed --noconfirm "${packages[@]}" || return 1
  elif command -v brew >/dev/null 2>&1; then
    echo "Install zathura and the MuPDF plugin with your package manager."
    return 1
  else
    echo "No supported package manager detected. Install zathura and zathura-pdf-mupdf manually."
    return 1
  fi
}

function check() {
  local src_dir="$rootdir/items/zathura/src"

  [ -L "$ZATHURA_CONF_DIR" ] || return 1
  [ "$(readlink "$ZATHURA_CONF_DIR")" = "$src_dir" ] || return 1
  [ -f "$ZATHURA_CONF_DIR/zathurarc" ] || return 1
  [ -f "$ZATHURA_CONF_DIR/epub.css" ]
}

function _backup_zathura_path() {
  local path="$1"
  local backup="${path}.bak"
  local index=1

  if [ ! -e "$backup" ] && [ ! -L "$backup" ]; then
    mv "$path" "$backup" || return 1
    return 0
  fi

  while [ -e "${backup}.${index}" ] || [ -L "${backup}.${index}" ]; do
    index=$((index + 1))
  done

  mv "$path" "${backup}.${index}"
}

function install() {
  local src_dir="$rootdir/items/zathura/src"

  if [[ "${dry_run:-0}" == 1 ]]; then
    echo "Would link $ZATHURA_CONF_DIR -> $src_dir"
    return 0
  fi

  mkdir -p "$(dirname "$ZATHURA_CONF_DIR")" || return 1

  if [ -L "$ZATHURA_CONF_DIR" ]; then
    rm -f "$ZATHURA_CONF_DIR" || return 1
  elif [ -e "$ZATHURA_CONF_DIR" ]; then
    _backup_zathura_path "$ZATHURA_CONF_DIR" || return 1
  fi

  ln -snf "$src_dir" "$ZATHURA_CONF_DIR" || return 1
}

function uninstall() {
  local src_dir="$rootdir/items/zathura/src"

  if [[ "${dry_run:-0}" == 1 ]]; then
    echo "Would remove $ZATHURA_CONF_DIR"
    return 0
  fi

  if [ -L "$ZATHURA_CONF_DIR" ] && [ "$(readlink "$ZATHURA_CONF_DIR")" = "$src_dir" ]; then
    rm -f "$ZATHURA_CONF_DIR" || return 1
  fi
}
