#!/usr/bin/env bash

TMUX_CONF_DIR="${CONFIG_DIR:-$HOME/.config}/tmux"

function check_dep() {
  local command_name

  for command_name in tmux curl jq; do
    command -v "$command_name" >/dev/null 2>&1 || return 1
  done

  return 0
}

function install_dep() {
  local command_name
  local -a missing_commands=()

  for command_name in tmux curl jq; do
    command -v "$command_name" >/dev/null 2>&1 || missing_commands+=("$command_name")
  done

  if ((${#missing_commands[@]} == 0)); then
    return 0
  fi

  echo "Required dependencies: ${missing_commands[*]}"

  if command -v pacman >/dev/null 2>&1; then
    run sudo pacman -S --needed --noconfirm "${missing_commands[@]}" || return 1
  elif command -v brew >/dev/null 2>&1; then
    run brew install "${missing_commands[@]}" || return 1
  else
    echo "No supported package manager detected. Install the missing dependencies manually."
    return 1
  fi
}

function check() {
  local src_dir="$rootdir/items/tmux/src"

  [ -L "$TMUX_CONF_DIR" ] && [ "$(readlink "$TMUX_CONF_DIR")" = "$src_dir" ] || return 1
  [ -f "$TMUX_CONF_DIR/tmux.conf" ] || return 1
  [ -x "$TMUX_CONF_DIR/bin/tmux-ai-name" ] || return 1
}

function install() {
  local src_dir="$rootdir/items/tmux/src"

  if [[ "${dry_run:-0}" == 1 ]]; then
    echo "Would link $TMUX_CONF_DIR -> $src_dir"
    return 0
  fi

  mkdir -p "$(dirname "$TMUX_CONF_DIR")" || return 1

  if [ -d "$TMUX_CONF_DIR" ] && [ ! -L "$TMUX_CONF_DIR" ]; then
    mv "$TMUX_CONF_DIR" "${TMUX_CONF_DIR}.bak" || return 1
  elif [ -e "$TMUX_CONF_DIR" ] || [ -L "$TMUX_CONF_DIR" ]; then
    rm -rf "$TMUX_CONF_DIR" || return 1
  fi

  ln -snf "$src_dir" "$TMUX_CONF_DIR" || return 1
}

function uninstall() {
  local src_dir="$rootdir/items/tmux/src"

  if [[ "${dry_run:-0}" == 1 ]]; then
    echo "Would remove $TMUX_CONF_DIR"
    return 0
  fi

  if [ -L "$TMUX_CONF_DIR" ] && [ "$(readlink "$TMUX_CONF_DIR")" = "$src_dir" ]; then
    rm -f "$TMUX_CONF_DIR" || return 1
  fi
}
