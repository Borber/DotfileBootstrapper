#!/usr/bin/env bash

MPV_CONF_DIR="${MPV_HOME:-${XDG_CONFIG_HOME:-$HOME/.config}/mpv}"
MPV_STATE_DIR="${MPV_HOME:-${XDG_STATE_HOME:-$HOME/.local/state}/mpv}"
MPV_DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/dotfile-bootstrapper/mpv"
MPV_UOSC_VERSION="5.13.0"
MPV_UOSC_SHA256="4be9da3289285300fa374496c3f1bfd7bb20ac08e890d25bd5a06b28eebe4882"
MPV_UOSC_DIR="$MPV_DATA_DIR/uosc-$MPV_UOSC_VERSION"
MPV_MEMO_REV="e0624611438b2e19ef4b7e24f53461c9d0304b07"
MPV_THUMBFAST_REV="0f711de3138c9bd6718209d819ac54022c23ded2"
MPV_BILIASS_VERSION="2.5.0"
MPV_BILIASS_DIR="$MPV_DATA_DIR/biliass-$MPV_BILIASS_VERSION"

declare -A MPV_LINKS=(
  [mpv.conf]="$rootdir/items/mpv/src/mpv.conf"
  [input.conf]="$rootdir/items/mpv/src/input.conf"
  [scripts/uosc]="$MPV_UOSC_DIR/scripts/uosc"
  [fonts/uosc_icons.otf]="$MPV_UOSC_DIR/fonts/uosc_icons.otf"
  [fonts/uosc_textures.ttf]="$MPV_UOSC_DIR/fonts/uosc_textures.ttf"
  [scripts/memo.lua]="$MPV_DATA_DIR/memo-$MPV_MEMO_REV/memo.lua"
  [scripts/thumbfast.lua]="$MPV_DATA_DIR/thumbfast-$MPV_THUMBFAST_REV/thumbfast.lua"
  [script-opts/uosc.conf]="$rootdir/items/mpv/src/script-opts/uosc.conf"
  [script-opts/memo.conf]="$rootdir/items/mpv/src/script-opts/memo.conf"
  [script-opts/local-danmaku.conf]="$rootdir/items/mpv/src/script-opts/local-danmaku.conf"
  [scripts/local-danmaku.lua]="$rootdir/items/mpv/src/scripts/local-danmaku.lua"
  [bin/biliass]="$MPV_BILIASS_DIR/bin/biliass"
)

function check_dep() {
  mpv --version >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1
}

function install_dep() {
  check_dep && return 0
  echo "Install a working mpv and Python 3 with venv support." >&2
  return 1
}

function _mpv_is_link() {
  [[ -L "$1" && "$(readlink -- "$1")" == "$2" ]]
}

function _mpv_uosc_ready() {
  [[ -f "$1/scripts/uosc/main.lua" &&
     -f "$1/fonts/uosc_icons.otf" &&
     -f "$1/fonts/uosc_textures.ttf" ]]
}

function check() {
  local path
  _mpv_uosc_ready "$MPV_UOSC_DIR" || return 1
  [[ -d "$MPV_STATE_DIR" ]] && _mpv_biliass_ready || return 1
  for path in "${!MPV_LINKS[@]}"; do
    [[ -e "${MPV_LINKS[$path]}" ]] || return 1
    _mpv_is_link "$MPV_CONF_DIR/$path" "${MPV_LINKS[$path]}" || return 1
  done
}

function _mpv_backup() {
  local path="$1" backup_base="$2" backup="$2" index=0
  while [[ -e "$backup" || -L "$backup" ]]; do
    index=$((index + 1))
    backup="$backup_base.$index"
  done
  mkdir -p -- "${backup%/*}" && mv -T -- "$path" "$backup"
}

function _mpv_download() {
  local url="$1" expected_hash="$2" path="$3" hash
  curl -fsSL --retry 2 --max-time 90 -o "$path" "$url" || return 1
  hash=$(sha256sum < "$path") || return 1
  if [[ "${hash%% *}" != "$expected_hash" ]]; then
    echo "Could not verify $url" >&2
    return 1
  fi
}

function _mpv_install_uosc() (
  _mpv_uosc_ready "$MPV_UOSC_DIR" && return 0

  local staging
  staging=$(mktemp -d "$MPV_DATA_DIR/.uosc.XXXXXX") || return 1
  trap 'rm -r -- "$staging"' EXIT

  echo "Downloading uosc $MPV_UOSC_VERSION"
  _mpv_download "https://github.com/tomasklaen/uosc/releases/download/$MPV_UOSC_VERSION/uosc.zip" \
    "$MPV_UOSC_SHA256" "$staging/uosc.zip" || return 1
  unzip -q "$staging/uosc.zip" -d "$staging/release" || return 1
  _mpv_uosc_ready "$staging/release" || return 1
  if [[ -e "$MPV_UOSC_DIR" || -L "$MPV_UOSC_DIR" ]]; then
    _mpv_backup "$MPV_UOSC_DIR" "$MPV_UOSC_DIR.bak" || return 1
  fi
  mv -T -- "$staging/release" "$MPV_UOSC_DIR"
)

function _mpv_install_lua() (
  local path="$1" url="$2" sha256="$3" staging
  [[ -s "$path" ]] && return 0

  mkdir -p -- "${path%/*}" || return 1
  staging=$(mktemp "$path.XXXXXX") || return 1
  trap '[[ ! -e "$staging" ]] || unlink -- "$staging"' EXIT
  echo "Downloading ${path##*/}"
  _mpv_download "$url" "$sha256" "$staging" &&
    mv -T -- "$staging" "$path"
)

function _mpv_biliass_ready() {
  PYTHONDONTWRITEBYTECODE=1 "$MPV_BILIASS_DIR/bin/biliass" --help >/dev/null 2>&1
}

function _mpv_install_biliass() {
  _mpv_biliass_ready && return 0

  echo "Installing biliass $MPV_BILIASS_VERSION in $MPV_BILIASS_DIR"
  python3 -m venv "$MPV_BILIASS_DIR" &&
    "$MPV_BILIASS_DIR/bin/python" -m pip --isolated --disable-pip-version-check install \
      --index-url https://pypi.org/simple --only-binary=:all: --no-deps "biliass==$MPV_BILIASS_VERSION" &&
    _mpv_biliass_ready
}

function _mpv_with_lock() (
  local lock_fd
  mkdir -p -- "$MPV_DATA_DIR" || return 1
  exec {lock_fd}>"$MPV_DATA_DIR/install.lock" || return 1
  flock "$lock_fd" || return 1
  "$@"
)

function _mpv_install() {
  local path target source
  _mpv_install_uosc || return 1
  _mpv_install_lua "${MPV_LINKS[scripts/memo.lua]}" \
    "https://raw.githubusercontent.com/po5/memo/$MPV_MEMO_REV/memo.lua" \
    "8670f52375a8d6602d46716734e65f0189048f99d40854f95bd043be9386309e" || return 1
  _mpv_install_lua "${MPV_LINKS[scripts/thumbfast.lua]}" \
    "https://raw.githubusercontent.com/po5/thumbfast/$MPV_THUMBFAST_REV/thumbfast.lua" \
    "a3d08e71eae8b892f6cd39f9593ea219768e709312d176bca883841b156448bf" || return 1
  _mpv_install_biliass || return 1
  mkdir -p -- "$MPV_STATE_DIR" || return 1

  for source in "${MPV_LINKS[@]}"; do
    [[ -e "$source" ]] || return 1
  done

  for path in "${!MPV_LINKS[@]}"; do
    target="$MPV_CONF_DIR/$path"
    source="${MPV_LINKS[$path]}"
    _mpv_is_link "$target" "$source" && continue
    mkdir -p -- "${target%/*}" || return 1
    if [[ -e "$target" || -L "$target" ]]; then
      # Keep old scripts outside mpv's autoload directory.
      _mpv_backup "$target" "$MPV_CONF_DIR/.bootstrap-backups/$path.bak" || return 1
    fi
    ln -sT -- "$source" "$target" || return 1
  done
}

function install() {
  if [[ "${dry_run:-0}" == 1 ]]; then
    local path
    if ! _mpv_uosc_ready "$MPV_UOSC_DIR"; then
      echo "Would download and verify uosc $MPV_UOSC_VERSION"
    fi
    for path in scripts/memo.lua scripts/thumbfast.lua; do
      if [[ ! -s "${MPV_LINKS[$path]}" ]]; then
        echo "Would download and verify ${path##*/}"
      fi
    done
    if ! _mpv_biliass_ready; then
      echo "Would install biliass $MPV_BILIASS_VERSION in $MPV_BILIASS_DIR"
    fi
    for path in "${!MPV_LINKS[@]}"; do
      echo "Would link $MPV_CONF_DIR/$path -> ${MPV_LINKS[$path]}"
    done
    return 0
  fi

  _mpv_with_lock _mpv_install
}

function _mpv_uninstall() {
  local path target
  for path in "${!MPV_LINKS[@]}"; do
    target="$MPV_CONF_DIR/$path"
    if _mpv_is_link "$target" "${MPV_LINKS[$path]}"; then
      unlink -- "$target" || return 1
    fi
  done
}

function uninstall() {
  if [[ "${dry_run:-0}" == 1 ]]; then
    echo "Would remove managed mpv links from $MPV_CONF_DIR"
    return 0
  fi

  _mpv_with_lock _mpv_uninstall
}
